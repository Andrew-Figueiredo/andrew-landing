# Headers de segurança.
#
# ATENÇÃO: no Nginx, um `add_header` dentro de um `location` descarta TODOS os `add_header`
# herdados do bloco `server`. Por isso estes headers vivem num arquivo incluído explicitamente
# no server E em cada location que declare o próprio `add_header`. Se você criar um location
# novo com add_header, inclua este arquivo nele também — senão as páginas servidas por ele
# ficam sem proteção, silenciosamente.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 'unsafe-inline' em script-src é exigido pelos scripts de hidratação que o Next.js injeta
# no export. Endurecer por hash exige regerar a política a cada build.
# next/font serve as fontes do próprio domínio, então não é preciso liberar o Google Fonts.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
