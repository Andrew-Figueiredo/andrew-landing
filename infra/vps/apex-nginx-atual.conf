
# ===== Apex (landpage) — HTTP -> HTTPS =====
server {
    listen 80;
    server_name andrewfigueiredo.dev www.andrewfigueiredo.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://andrewfigueiredo.dev$request_uri;
    }
}

# ===== Apex (landpage) — HTTPS + default_server (catch-all) =====
server {
    listen 443 ssl default_server;
    http2 on;
    server_name andrewfigueiredo.dev www.andrewfigueiredo.dev;

    ssl_certificate     /etc/letsencrypt/cloudflare/andrewfigueiredo.dev.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/andrewfigueiredo.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    if ($host = www.andrewfigueiredo.dev) {
        return 301 https://andrewfigueiredo.dev$request_uri;
    }

    root /usr/share/nginx/andrew-portfolio;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

